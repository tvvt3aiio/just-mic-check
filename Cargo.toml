[package]
name = "just-mic-check"
version = "0.1.0"
edition = "2021"
description = "Lightweight Windows tray app for checking your microphone"
license = "MIT"
publish = false

[dependencies]
cpal = "0.18"
ringbuf = "0.6"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging"] }
winsafe = { version = "0.0.29", features = ["advapi", "gui", "shell"] }

[build-dependencies]
embed-resource = "3"
png = "0.18"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
