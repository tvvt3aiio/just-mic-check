name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" target/release/just-mic-check.exe --draft --verify-tag --title "$env:GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
